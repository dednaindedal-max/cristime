name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: Manifest (landscape, camera, fullscreen, icon)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true"#' $M
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          sed -i 's#AppTheme.NoActionBarLaunch#Theme.AppCompat.NoActionBar.FullScreen#; s#"@style/AppTheme.NoActionBar"#"@style/Theme.AppCompat.NoActionBar.FullScreen"#' $M || true
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in $R/mipmap-*; do cp www/icon-192.png $d/ic_launcher.png; cp www/icon-192.png $d/ic_launcher_round.png; cp www/icon-192.png $d/ic_launcher_foreground.png; done
          cat > $R/values/fs.xml <<'X'
          <resources><style name="Theme.AppCompat.NoActionBar.FullScreen" parent="Theme.AppCompat.NoActionBar"><item name="android:windowFullscreen">true</item><item name="android:windowBackground">#0b1030</item></style></resources>
          X
          cat $M
      - run: cp native/*.java android/app/src/main/java/app/cristime/game/
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Cristime.apk
      - uses: actions/upload-artifact@v4
        with: { name: Cristime-apk, path: Cristime.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "v${{ github.run_number }}", name: "Cristime v${{ github.run_number }}", files: Cristime.apk }
